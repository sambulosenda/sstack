# Issue to PR: a coding agent makes the change a GitHub issue asks for and opens a pull request.
# Started by .github/workflows/agent-label.yml when a person adds the "agent" label to an issue.
# The PR it opens is then tested by .eas/workflows/pr.yml.
#
# From Expo's guide: https://docs.expo.dev/agentic-workflows/issue-to-pr/

name: Issue to PR

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: The number of the issue that the agent works on
        type: string
        required: true

jobs:
  change:
    environment: preview
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      MAX_AGENT_PRS_PER_DAY: '10'
      # 'on': a read-only agent checks that the issue is ready before any code is written.
      TRIAGE: 'on'
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Make the change and open a pull request
        run: bash .eas/agents/make-change.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: issue-to-pr-log
          path: /tmp/agent-change/agent-output/**/*
