# Weekly report on how the factory is doing: merge rate, first-pass rate, how often a
# person had to step in. The table appears on the summary page of the run.
# Run it any time from the Actions tab, or locally:
#   GITHUB_TOKEN=$(gh auth token) GITHUB_REPOSITORY=owner/repo node scripts/factory/metrics.mjs 30

name: Factory metrics

on:
  schedule:
    - cron: '17 7 * * 1' # Mondays, 07:17 UTC
  workflow_dispatch:
    inputs:
      days:
        description: How many days to look back
        default: '30'

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: node scripts/factory/metrics.mjs ${{ inputs.days || '30' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
